services:
  db:
    image: postgres:16-alpine
    container_name: emertrack-db
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: emertrack
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: emertrack-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9101"
    command: server /data --console-address ":9101"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: emertrack-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL}
        NEXT_PUBLIC_EMAIL_EMERTRACK: ${NEXT_PUBLIC_EMAIL_EMERTRACK}
    container_name: emertrack-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: emertrack-nginx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/docker-entrypoint-emertrack.sh:/docker-entrypoint-emertrack.sh:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-emertrack.sh"]
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  minio_data: